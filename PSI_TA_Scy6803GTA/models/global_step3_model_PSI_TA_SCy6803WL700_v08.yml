# Migrated from pyglotaran v0.7 for v0.8 staging validation.
library:
  complex700:
    type: kinetic
    rates:
      (r2, r1): rates.k21
      (r3, r2): rates.k32
      (r4, r3): rates.k43
      (r4, r4): rates.k44
  artifact700:
    type: coherent-artifact
    order: 3
experiments:
  default:
    residual_function: variable_projection
    datasets:
      700TR1:
        elements:
        - complex700
        - artifact700
        activations:
          irf:
            type: gaussian
            compartments:
              r1: input.1
              r2: input.0
              r3: input.0
              r4: input.0
              artifact700: 1
            center: irf.center2
            width: irf.width2
            dispersion_center: irf.dispcenter
            center_dispersion_coefficients: &id001
            - irf.disp1
            reciproke_global_axis: true
      700TR2:
        elements:
        - complex700
        activations:
          irf:
            type: gaussian
            compartments:
              r1: input.1
              r2: input.0
              r3: input.0
              r4: input.0
            center: irf.center2
            width: irf.width2
            dispersion_center: irf.dispcenter
            center_dispersion_coefficients: *id001
            reciproke_global_axis: true
    clp_link_tolerance: 0.1
    scale:
      700TR1: scale.700
      700TR2: scale.700TR2
